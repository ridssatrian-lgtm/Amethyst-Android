name: Android CI

on:
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.apk

      - name: Verify APK integrity
        run: |
          unzip -tq out/app-debug.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose out/app-debug.apk
          SIZE=$(stat -c %s out/app-debug.apk)
          SHA=$(sha256sum out/app-debug.apk | cut -d' ' -f1)
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Publish release (v3_openjdk only)
        if: github.ref == 'refs/heads/v3_openjdk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/app-debug.apk NevLauncher.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug NevLauncher.apk \
            --title "Nev Launcher (debug build)" \
            --notes "Build otomatis dari commit ${GITHUB_SHA::7}. Ukuran file: ${APK_SIZE} byte. SHA-256: ${APK_SHA}. Lolos unzip -t dan apksigner verify." \
            --prerelease --target "$GITHUB_SHA"
